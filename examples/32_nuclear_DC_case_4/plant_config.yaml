name: plant_config
description: >
  Case 4 – Two nuclear plants (combined single component) + Nat Gas backup + DC behind the meter.
  The notebook models two 1000 MW plants via a combined availability profile: both on = 100%,
  one offline = 50%, both offline = never (staggered maintenance enforces this constraint).
  Nat gas (NGCT) covers the 50% deficit when one plant is offline.
  Grid sell exports nuclear surplus when combined nuclear > DC demand.
  Note: nat gas grid-sell would require a multi-source aggregator (OpenMDAO single-input constraint).

sites:
  site:
    latitude: 40.0
    longitude: -105.0

technology_interconnections:
  - [nuclear, electrical_load_demand, [electricity_out, electricity_in]]
  - [electrical_load_demand, nat_gas, [electricity_unmet_demand, electricity_demand]]
  - [electrical_load_demand, grid_sell, [electricity_unused_commodity, electricity_in]]

plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760   # 1 year hourly
    dt: 3600            # seconds per timestep

finance_parameters:
  finance_groups:
    finance_model: ProFastLCO
    model_inputs:
      params:
        analysis_start_year: 2024
        installation_time: 60
        inflation_rate: 0.0
        discount_rate: 0.06
        debt_equity_ratio: 0.6
        property_tax_and_insurance: 0.025
        total_income_tax_rate: 0.26
        capital_gains_tax_rate: 0.15
        sales_tax_rate: 0.0
        debt_interest_rate: 0.07
        debt_type: Revolving debt
        loan_period_if_used: 0
        cash_onhand_months: 1
        admin_expense: 0.00
      capital_items:
        depr_type: MACRS
        depr_period: 7
        refurb: [0.]

    npv:
      finance_model: ProFastNPV
      model_inputs:
        commodity_sell_price: 0.10  # $/kWh — override per scenario in notebook
        params:
          analysis_start_year: 2024
          installation_time: 60
          inflation_rate: 0.0
          discount_rate: 0.06
          debt_equity_ratio: 0.6
          property_tax_and_insurance: 0.025
          total_income_tax_rate: 0.26
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.0
          debt_interest_rate: 0.07
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.00
        capital_items:
          depr_type: MACRS
          depr_period: 7
          refurb: [0.]

  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022

  finance_subgroups:
    nuclear:
      commodity: electricity
      commodity_stream: nuclear
      technologies: [nuclear, nat_gas]  # nat_gas is a real cost; grid_sell revenue excluded

    nuclear_npv:
      commodity: electricity
      commodity_stream: nuclear
      technologies: [nuclear, nat_gas]
      finance_groups: [npv]
