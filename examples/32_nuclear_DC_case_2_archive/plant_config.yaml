name: plant_config
description: Plant configuration with nuclear powering a data center
sites:
  site:
    latitude: 40.0
    longitude: -105.0

# Nuclear output feeds DC demand controller; unmet demand is purchased from grid
technology_interconnections:
  - [nuclear, electrical_load_demand, [electricity_out, electricity_in]]
  - [electrical_load_demand, grid, [electricity_unmet_demand, electricity_demand]]

plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760  # 1 year hourly
    dt: 3600  # seconds per timestep

finance_parameters:
  finance_groups:
    finance_model: ProFastLCO
    model_inputs:
      params:
        analysis_start_year: 2024
        installation_time: 60  # months
        inflation_rate: 0.0
        discount_rate: 0.06
        debt_equity_ratio: 0.6
        property_tax_and_insurance: 0.025
        total_income_tax_rate: 0.26
        capital_gains_tax_rate: 0.15
        sales_tax_rate: 0.0
        debt_interest_rate: 0.07
        debt_type: Revolving debt
        loan_period_if_used: 0
        cash_onhand_months: 1
        admin_expense: 0.00
      capital_items:
        depr_type: MACRS
        depr_period: 7
        refurb: [0.]

    npv:
      finance_model: ProFastNPV
      model_inputs:
        commodity_sell_price: 0.10  # $/kWh — override per scenario in notebook
        params:
          analysis_start_year: 2024
          installation_time: 60
          inflation_rate: 0.0
          discount_rate: 0.06
          debt_equity_ratio: 0.6
          property_tax_and_insurance: 0.025
          total_income_tax_rate: 0.26
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.0
          debt_interest_rate: 0.07
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.00
        capital_items:
          depr_type: MACRS
          depr_period: 7
          refurb: [0.]

  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022

  finance_subgroups:
    nuclear:
      commodity: electricity
      commodity_stream: nuclear
      technologies: [nuclear]  # Exclude grid to avoid including revenue in LCOE

    nuclear_npv:
      commodity: electricity
      commodity_stream: nuclear
      technologies: [nuclear]
      finance_groups: [npv]
