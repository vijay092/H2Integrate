name: plant_config
description: >
  Plant configuration: nuclear + BESS + data center load + bidirectional grid
  (Case 5). Nuclear is the primary power source for the DC; the BESS buffers
  fast/short-duration mismatches between nuclear output and DC demand before
  they reach the grid interconnection. Surplus beyond the BESS's capacity is
  sold to the grid; shortfall beyond the BESS's capacity is bought from the
  grid.

sites:
  site:
    latitude: 40.0
    longitude: -105.0

# Topology:
#
#   Nuclear ──┬─[electricity]──► BESS ──┐
#             └─[electricity]──────────►├─► elec_combiner ─► electrical_load_demand
#                                        │                          │        │
#                                        │              [unmet_demand]  [unused_commodity]
#                                        │                          ▼        ▼
#                                        │                      grid_buy  grid_sell
#
technology_interconnections:
  - [nuclear, battery, electricity, cable]
  - [nuclear, elec_combiner, electricity, cable]
  - [battery, elec_combiner, electricity, cable]
  - [elec_combiner, electrical_load_demand, electricity, cable]
  - [electrical_load_demand, grid_buy, [unmet_electricity_demand_out, electricity_set_point]]
  - [electrical_load_demand, grid_sell, [unused_electricity_out, electricity_in]]

plant:
  plant_life: 80
  simulation:
    n_timesteps: 8760  # 1 year hourly
    dt: 3600  # seconds per timestep

finance_parameters:
  finance_groups:
    finance_model: ProFastLCO
    model_inputs:
      params:
        analysis_start_year: 2024
        installation_time: 88        # months (Shirvan 2024)
        inflation_rate: 0.025        # 2.5% (Shirvan 2024)
        discount_rate: 0.125         # cost of equity (Re), Shirvan 2024 -- ProFAST blends this
                                      # with debt_interest_rate internally into the actual WACC:
                                      # 0.5×0.065×(1−0.275) + 0.5×0.125 = ~8.6%. Do NOT put the
                                      # already-blended 8.6% here -- ProFAST would blend it AGAIN.
        debt_equity_ratio: 1.0       # 50% debt / 50% equity (Shirvan 2024)
        property_tax_and_insurance: 0.0  # embedded in OpEx
        total_income_tax_rate: 0.275 # 27.5% (Lazard 2024)
        capital_gains_tax_rate: 0.15 # standard U.S. long-term rate
        sales_tax_rate: 0.0
        debt_interest_rate: 0.065    # 6.5% (Shirvan 2024)
        debt_type: Revolving debt
        loan_period_if_used: 0
        cash_onhand_months: 1
        admin_expense: 0.00
        one_time_cap_inct:
          value: 0.0
          depr_type: MACRS
          depr_period: 5
          depreciable: false
      capital_items:
        depr_type: MACRS
        depr_period: 15              # IRS Pub. 946 nuclear (battery overrides its own, see tech_config)
        refurb: [0.]

    npv:
      finance_model: ProFastNPV
      model_inputs:
        commodity_sell_price: 0.10       # $/kWh — override per scenario in notebook
        commodity_sell_price_units: USD/(kW*h)
        params:
          analysis_start_year: 2024
          installation_time: 88        # months (Shirvan 2024)
          inflation_rate: 0.025        # 2.5% (Shirvan 2024)
          discount_rate: 0.125         # cost of equity (Re), Shirvan 2024 -- ProFAST blends this
                                        # into the actual ~8.6% WACC internally; see note above.
          debt_equity_ratio: 1.0       # 50% debt / 50% equity (Shirvan 2024)
          property_tax_and_insurance: 0.0  # embedded in OpEx
          total_income_tax_rate: 0.275 # 27.5% (Lazard 2024)
          capital_gains_tax_rate: 0.15 # standard U.S. long-term rate
          sales_tax_rate: 0.0
          debt_interest_rate: 0.065    # 6.5% (Shirvan 2024)
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.00
          # IRA §48E ITC: 30% of combined nuclear+battery CapEx; baseline here is
          # no ITC (0), the notebook overrides this per-scenario.
          one_time_cap_inct:
            value: 0.0
            depr_type: MACRS
            depr_period: 5
            depreciable: false
        capital_items:
          depr_type: MACRS
          depr_period: 15
          refurb: [0.]

  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022

  finance_subgroups:
    nuclear:
      commodity: electricity
      commodity_stream: nuclear
      # grid_buy/grid_sell excluded to avoid mixing in buy cost/sell revenue;
      # nuclear_poi adds nuclear's own interconnection CapEx/OpEx (cost-only,
      # no buy/sell price) so that cost isn't silently dropped from the LCOE.
      technologies: [nuclear, battery, nuclear_poi]

    nuclear_npv:
      commodity: electricity
      commodity_stream: nuclear
      technologies: [nuclear, battery, nuclear_poi]  # combined NPV, same pooling as the LCOE subgroup above
      finance_groups: [npv]
