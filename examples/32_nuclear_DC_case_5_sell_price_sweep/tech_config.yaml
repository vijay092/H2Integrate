name: technology_config
description: Technology configuration for nuclear plant powering a data center
# For ap170
technologies:
  nuclear:
    performance_model:
      model: QuinnNuclearPerformanceModel
    cost_model:
      model: QuinnNuclearCostModel
    model_inputs:
      shared_parameters:
        system_capacity_kw: 1000000  # 1000 MW nuclear plant
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        capex_per_kw: 9300              # $/kW AP1000 greenfield (Shirvan 2024)
        fixed_opex_per_kw_year: 0.0
        variable_opex_per_mwh: 23       # $/MWh (Shirvan 2024)
        reference_capacity_kw: 1000000
        capex_scaling_exponent: 0.5    

  grid:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 1000000  # kW, sized to match nuclear plant
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        interconnection_capex_per_kw: 100   # $/kW
        interconnection_opex_per_kw: 5      # $/kW/year
        fixed_interconnection_cost: 0
        electricity_sell_price: 0.05       # $/kWh revenue for surplus sold to grid

  # Cost-only counterpart to `grid`: same interconnection CapEx/OpEx rates,
  # but with no buy/sell price attached, so including it in the LCOE finance
  # subgroup adds nuclear's own point-of-interconnection cost without also
  # pulling in the grid's sell revenue (which `grid` itself is deliberately
  # excluded from the LCOE subgroup to avoid -- see plant_config.yaml).
  # Not wired into technology_interconnections: CapEx/OpEx here depend only
  # on interconnection_size, not on any actual electricity flow, so no
  # physical connection is needed for the cost to be computed correctly.
  nuclear_poi:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 1000000  # kW, sized to match nuclear plant
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        interconnection_capex_per_kw: 100   # $/kW (same rate as `grid`)
        interconnection_opex_per_kw: 5      # $/kW/year (same rate as `grid`)
        fixed_interconnection_cost: 0
