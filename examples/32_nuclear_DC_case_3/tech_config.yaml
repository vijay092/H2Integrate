name: technology_config
description: >
  Technology configuration for nuclear + data center + bidirectional grid (Case 3).
  Grid has both electricity_sell_price (revenue from surplus) and
  electricity_buy_price (cost of grid backup) to model bidirectional cash flows.

technologies:
  nuclear:
    performance_model:
      model: QuinnNuclearPerformanceModel
    cost_model:
      model: QuinnNuclearCostModel
    model_inputs:
      shared_parameters:
        system_capacity_kw: 1000000   # 1000 MW default; varied in notebook sweep
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        capex_per_kw: 6500            # $/kW
        fixed_opex_per_kw_year: 150   # $/kW/year
        variable_opex_per_mwh: 15     # $/MWh
        reference_capacity_kw: 1000000
        capex_scaling_exponent: 0.85

  grid:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        # Sized to handle max nuclear sweep (3 GW) so interconnection never clips flows.
        # Varied in the notebook to match nuclear plant size for cost scaling.
        interconnection_size: 3000000   # kW
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        interconnection_capex_per_kw: 100    # $/kW
        interconnection_opex_per_kw: 5       # $/kW/year
        fixed_interconnection_cost: 0
        # Revenue earned when nuclear surplus flows to grid
        electricity_sell_price: 0.05         # $/kWh
        # Cost incurred when grid backs up the DC (nuclear is undersized)
        electricity_buy_price: 0.08          # $/kWh

  electrical_load_demand:
    control_strategy:
      model: DemandOpenLoopConverterController
    model_inputs:
      control_parameters:
        commodity: electricity
        commodity_rate_units: kW
        demand_profile: 2000000   # 2000 MW constant DC load
