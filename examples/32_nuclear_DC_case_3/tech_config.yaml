name: technology_config
description: >
  Technology configuration for nuclear + data center + bidirectional grid (Case 3).
  Grid has both electricity_sell_price (revenue from surplus) and
  electricity_buy_price (cost of grid backup) to model bidirectional cash flows.

technologies:
  nuclear:
    performance_model:
      model: QuinnNuclearPerformanceModel
    cost_model:
      model: QuinnNuclearCostModel
    model_inputs:
      shared_parameters:
        system_capacity_kw: 1000000  # 1000 MW nuclear plant
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        capex_per_kw: 7400
        fixed_opex_per_kw_year: 0.0
        variable_opex_per_mwh: 28
        reference_capacity_kw: 1000000
        capex_scaling_exponent: 0.7

  # Separate grid connection for buying backup power when nuclear < DC demand
  grid_buy:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 2000000   # kW, sized to max DC demand (2 GW)
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        interconnection_capex_per_kw: 100    # $/kW
        interconnection_opex_per_kw: 5       # $/kW/year
        fixed_interconnection_cost: 0
        electricity_buy_price: 0.08          # $/kWh — cost of backup power

  # Separate grid connection for nuclear selling surplus when nuclear > DC demand
  grid_sell:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 3000000   # kW, sized to max nuclear sweep (3 GW)
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        interconnection_capex_per_kw: 100    # $/kW
        interconnection_opex_per_kw: 5       # $/kW/year
        fixed_interconnection_cost: 0
        electricity_sell_price: 0.05         # $/kWh — revenue from surplus sales

  electrical_load_demand:
    control_strategy:
      model: DemandOpenLoopConverterController
    model_inputs:
      control_parameters:
        commodity: electricity
        commodity_rate_units: kW
        demand_profile: 2000000   # 2000 MW constant DC load
