name: plant_config
description: >
  Plant configuration: nuclear + data center load + bidirectional grid.
  Nuclear is the primary power source for the DC.
  Nuclear surplus (electricity_unused_commodity) is sold to the grid for revenue.
  Grid backs up the DC (via electricity_demand) when nuclear is undersized.

sites:
  site:
    latitude: 40.0
    longitude: -105.0

# Topology (Case 3 -- bidirectional grid):
#
#   Nuclear ──[electricity_out]──► electrical_load_demand ──[electricity_unmet_demand]──► Grid (buy backup)
#                                                         └──[electricity_unused_commodity]──► Grid (sell surplus)
#
technology_interconnections:
  # 1. Nuclear output feeds the DC demand controller
  - [nuclear, electrical_load_demand, [electricity_out, electricity_in]]

  # 2. When nuclear < DC demand: unmet demand is purchased from the grid
  - [electrical_load_demand, grid, [electricity_unmet_demand, electricity_demand]]

  # 3. When nuclear > DC demand: unused (surplus) electricity is sold to the grid
  - [electrical_load_demand, grid, [electricity_unused_commodity, electricity_in]]

plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760  # 1 year hourly
    dt: 3600           # seconds per timestep

finance_parameters:
  finance_groups:
    finance_model: ProFastLCO
    model_inputs:
      params:
        analysis_start_year: 2024
        installation_time: 60     # months
        inflation_rate: 0.0       # real analysis
        discount_rate: 0.06
        debt_equity_ratio: 0.6
        property_tax_and_insurance: 0.025
        total_income_tax_rate: 0.26
        capital_gains_tax_rate: 0.15
        sales_tax_rate: 0.0
        debt_interest_rate: 0.07
        debt_type: Revolving debt
        loan_period_if_used: 0
        cash_onhand_months: 1
        admin_expense: 0.00
      capital_items:
        depr_type: MACRS
        depr_period: 7
        refurb: [0.]

  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022

  finance_subgroups:
    nuclear:
      commodity: electricity
      commodity_stream: nuclear
      technologies: [nuclear, grid]
