name: technology_config
description: Technology configuration for nuclear plant powering a data center
# For ap170
technologies:
  nuclear:
    performance_model:
      model: QuinnNuclearPerformanceModel
    cost_model:
      model: QuinnNuclearCostModel
    model_inputs:
      shared_parameters:
        system_capacity_kw: 1000000  # 1000 MW nuclear plant
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        capex_per_kw: 7400
        fixed_opex_per_kw_year: 0.0
        variable_opex_per_mwh: 28
        reference_capacity_kw: 1000000
        capex_scaling_exponent: 0.7

  grid:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 1000000  # kW, sized to match nuclear plant
      performance_parameters: {}
      cost_parameters:
        cost_year: 2024
        interconnection_capex_per_kw: 100   # $/kW
        interconnection_opex_per_kw: 5      # $/kW/year
        fixed_interconnection_cost: 0
        electricity_sell_price: 0.05        # $/kWh revenue for surplus sold to grid
